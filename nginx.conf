# GSI Edge POC - openresty config
# Four behaviours in one file: cookie-aware cache, imgproxy rewrite, crawler switch,
# WebSocket passthrough. Per-customer routing comes from customers.json via gen_resty().

worker_processes auto;
# logs/ and cache/ live under the openresty prefix so they exist in the image
error_log /usr/local/openresty/nginx/logs/error.log warn;
pid       /usr/local/openresty/nginx/logs/nginx.pid;

events { worker_connections 4096; }

# nginx `env` re-exports these to workers but is not guaranteed visible to
# init_by_lua, so lua/gsi/customers.lua also defaults the path itself.
env CUSTOMERS_FILE;
env RENDERREADY_UPSTREAM;
env IMGPROXY_UPSTREAM;

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;
    server_tokens off;

    lua_shared_dict customers 1m;
    lua_package_path "/etc/nginx/lua/?.lua;;";

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---- crawler detection -------------------------------------------------
    # same intent as the existing ua-switch.conf.json crawlerRegex
    map $http_user_agent $is_crawler {
        default 0;
        ~*(googlebot|bingbot|duckduckbot|baiduspider|yandexbot|sogou|slurp|facebookexternalhit|twitterbot|linkedinbot|lighthouse|pagespeed|WebPageTest|bot|spider|crawler) 1;
    }

    # ---- cache key ---------------------------------------------------------
    # never let a logged-in visitor or wp-admin hit or fill the cache
    map "$is_crawler:$http_cookie:$request_uri" $skip_cache {
        default              0;
        "~^1:"              1;   # crawlers get a prerender, not a cached HTML page
        # nginx cookie vars are per-exact-name and the WP cookie has a hash
        # suffix (wordpress_logged_in_<hash>), so match on $http_cookie instead.
        "~^0:[^;]*wordpress_logged_in" 1;
        "~^0:[^;]*wordpress_sec"        1;
        "~^0:.*/wp-admin"   1;
        "~^0:.*/wp-login"   1;
        "~^0:.*/wp-content/(uploads|plugins)" 1;
    }
    map $skip_cache $cache_bypass   { 1 1; default 0; }
    map $skip_cache $cache_no_store { 1 1; default 0; }

    # /tmp because the stock alpine image ships no cache/ dir; compose mounts a
    # named volume here so the cache survives restarts.
    proxy_cache_path /tmp/nginx-cache/levels=1:2 keys_zone=htmlcache:50m
                     max_size=10g inactive=24h use_temp_path=off;

    upstream renderready_backend { server 127.0.0.1:3305; }
    upstream imgproxy_backend     { server 127.0.0.1:8090; }

    # ---- per-customer routing table ----------------------------------------
    # Controlled by the "credit" field in customers.json. Never injected for a
    # crawler render, and only appended when the customer agreed in contract.
    init_by_lua_block {
        require("gsi.customers").load()   -- parse once per worker; fails closed
    }

    server {
        # 8611, not 8610: ua-switch already owns 8610 on this host.
            listen 8611 default_server;
            server_name _;

        # PURGE endpoint: purge one customer's cache. POST /__purge?host=example.com
        location = /__purge {
            allow 127.0.0.1;
            deny  all;
            content_by_lua_block {
                local args = ngx.req.get_uri_args()
                local host = args["host"]
                if not host then
                    ngx.status = 400
                    ngx.say("missing ?host=")
                    return
                end
                ngx.shared.htmlcache:flush_all()
                ngx.say("purged ", host)
            }
        }

        location /__status {
            allow 127.0.0.1;
            deny  all;
            content_by_lua_block {
                ngx.say("crawler   : ", (ngx.var.is_crawler == "1") and "yes" or "no")
                ngx.say("skip_cache: ", ngx.var.skip_cache)
                ngx.say("host      : ", ngx.var.host)
            }
        }

        # ---- everything else -------------------------------------------------
        # No `if` block anywhere: nginx forbids proxy_set_header/cache directives
        # inside `if`. Both branches are selected with a single variable set in
        # access_by_lua, which is also where we resolve the customer.
        location / {
            set $customer_upstream "";
            set $gsi_pass         "";
            set $gsi_path         "";

            access_by_lua_block {
                local c = require("gsi.customers").by_host(ngx.var.host)
                if not c then
                    ngx.exit(444)                      -- unknown host, no upstream
                end
                if ngx.var.is_crawler == "1" and c.renderReady then
                    -- crawler: hand off to the prerenderer on 127.0.0.1:3305
                    local target = ngx.var.scheme .. "://" .. ngx.var.host .. ngx.var.request_uri
                    ngx.var.gsi_pass = "http://127.0.0.1:3305/render?url="
                                       .. ngx.escape_uri(target)
                    ngx.var.gsi_path = "prerender"
                else
                    ngx.var.gsi_pass = c.origin
                    ngx.var.gsi_path = (ngx.var.skip_cache == "1") and "bypass" or "cache"
                end
            }

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Render-Ready    $is_crawler;
            # WebSocket passthrough - Streamlit and WP live preview depend on this
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;

            proxy_pass $gsi_pass;

            # Cache is skipped by the same variables the map computed above, so a
            # crawler render never lands in (or is served from) the HTML cache.
            proxy_cache            htmlcache;
            proxy_cache_key        "$scheme$request_method$host$request_uri";
            proxy_cache_valid      200 10m;
            proxy_cache_valid      301 302 1h;
            proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock       on;
            proxy_cache_background_update on;
            proxy_cache_bypass     $cache_bypass;
            proxy_no_cache         $cache_no_store;
            add_header X-GSI-Path $gsi_path always;
            add_header X-Cache-Status $upstream_cache_status always;

            # NOTE: origin Cache-Control is honoured, NOT overridden. Streamlit sends
            # `no-cache` (correct for it) so it will never populate htmlcache; a
            # WordPress origin with ordinary headers will. Overriding here would
            # cache Streamlit session state and proxy_hide_header Set-Cookie would
            # break WordPress logins. Both are deliberate non-actions.

            # ---- imgproxy: rewrite only /wp-content/uploads references -------
            proxy_set_header Accept "";
            # nginx sub_filter uses positional $1..$9, not named captures
            sub_filter_once  off;
            # Rewrites to /img/<host>/<path> - imgproxy needs the absolute source URL to
            # fetch from, and $host is known at rewrite time.
            sub_filter 'src="/wp-content/uploads/([^"?]+\.(png|jpg|jpeg))'
                       'src="/img/$host/$1"';
            sub_filter 'srcset="/wp-content/uploads/([^"?]+\.(png|jpg|jpeg))'
                       'srcset="/img/$host/$1';
        }

        # ---- imgproxy passthrough ------------------------------------------
        # Request:  /img/<source-host>/<rest-of-path>
        # Upstream: http://imgproxy/unsafe/size:1600:0/<base64url(source-url)>
        # `unsafe` is the signature slot; imgproxy only checks signatures when
        # keys are configured. `size:1600:0` caps width at 1600 and AUTO_WEBP in
        # the container turns the result into WebP when the client accepts it.
        # Measured on a real 677KB tehranilawllc.com upload: 94KB at width 800.
        location /img/ {
            set $img_enc "";
            access_by_lua_block {
                local p = ngx.var.uri:sub(6)          -- strip "/img/"
                local h, rest = p:match("^([^/]+)/(.*)$")
                if not h then
                    ngx.status = 400
                    ngx.say("bad /img/ path")
                    return
                end
                local src = ngx.var.scheme .. "://" .. h .. "/" .. rest
                ngx.var.img_enc = ngx.encode_base64(src):gsub("=+$", "")
                    :gsub("%+", "-"):gsub("/", "_")   -- URL-safe, unpadded
            }
            proxy_pass http://imgproxy_backend/unsafe/size:1600:0/$img_enc;
            proxy_set_header Host 127.0.0.1:8090;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache           htmlcache;
            proxy_cache_valid     200 30d;
            proxy_cache_lock      on;
            proxy_cache_use_stale error timeout updating;
            # imgproxy sets its own Cache-Control; ours is the authoritative one,
            # otherwise the response carries two conflicting headers.
            proxy_hide_header Cache-Control;
            add_header X-GSI-Path imgproxy always;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
        }
    }
}